<!DOCTYPE html>
<html lang="en">
<head>
<base href="../../../"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CueMark - Settings</title><link rel="manifest" href="manifest.json"><script src="core/theme-bootstrap.js"></script><link rel="stylesheet" href="static/index.css"><script defer src="core/logcat.js"></script><script defer src="lucide.min.js"></script></head>
<body class="settings-screen settings-category-screen"><div id="app-container">
<header class="settings-ios-header">
  <button class="settings-ios-back page-back-btn" type="button" data-back-fallback="static/pages/settings/settings.html">‹ Settings</button>
  <h1>Dashboard &amp; Navigation</h1>
  <span class="settings-ios-header-spacer" aria-hidden="true"></span>
</header>
<main><section id="tab-settings" class="tab-content active settings-category-page"><div class="settings-page-header settings-category-title"><p class="settings-breadcrumb"><a href="static/pages/settings/settings.html">Settings</a> / Dashboard &amp; Navigation</p><h2>Dashboard &amp; Navigation</h2></div>
<div class="settings-search settings-page-search"><i data-lucide="search"></i><input data-settings-search-input type="search" placeholder="Search all settings" aria-label="Search all settings"><button type="button" class="settings-search-clear" data-settings-search-clear aria-label="Clear search" hidden><i data-lucide="x"></i></button></div>
<div class="settings-search-history" data-settings-search-history hidden></div>
<div class="settings-search-results" data-settings-search-results hidden aria-live="polite"></div>

<div class="settings-section"><div class="settings-list"><button type="button" class="settings-row settings-row-picker" data-pref="compactMode" data-direct-toggle="true" role="switch" aria-checked="false" id="setting-compactMode">
      <div class="settings-row-icon"><i data-lucide="list-collapse"></i></div>
      <div class="settings-row-body"><label>Compact Mode</label></div>
      <div class="settings-row-value"><span>Off</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button>
<button type="button" class="settings-row settings-row-picker" id="dashboard-view-picker" data-pref="dashboardView">
      <div class="settings-row-icon"><i data-lucide="layout-grid"></i></div>
      <div class="settings-row-body"><label>Dashboard View</label><span>Choose list, compact list, grids, or table view.</span></div>
      <div class="settings-row-value"><span id="dashboard-view-picker-value">List</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button>
<button type="button" class="settings-row settings-row-picker" data-pref="dashboardDefaultCategory" id="setting-dashboardDefaultCategory">
      <div class="settings-row-icon"><i data-lucide="list-filter"></i></div>
      <div class="settings-row-body"><label>Default Category</label><span>Choose which category opens on the Dashboard.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button>
<button type="button" class="settings-row settings-row-picker" data-pref="recentlyAddedLimit" id="setting-recentlyAddedLimit">
      <div class="settings-row-icon"><i data-lucide="clock-3"></i></div>
      <div class="settings-row-body"><label>Recently Added Limit</label><span>Choose how many recent items appear on the Dashboard.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button>
<button type="button" class="settings-row settings-row-picker" data-pref="dashboardCardCorners" id="setting-dashboardCardCorners">
      <div class="settings-row-icon"><i data-lucide="square-dashed"></i></div>
      <div class="settings-row-body"><label>Card Corner Style</label><span>Choose rounded, soft, or square Dashboard cards.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button></div></div><div class="settings-page-header settings-detail-group-title"><h4 class="settings-section-title">Dashboard display</h4></div><div class="settings-section"><div class="settings-list"><button type="button" class="settings-row settings-row-picker" data-pref="dashboardDensity" id="setting-dashboardDensity">
      <div class="settings-row-icon"><i data-lucide="rows-3"></i></div>
      <div class="settings-row-body"><label>Dashboard Density</label><span>Control the spacing between dashboard items.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" data-pref="dashboardGroupBy" id="setting-dashboardGroupBy">
      <div class="settings-row-icon"><i data-lucide="group"></i></div>
      <div class="settings-row-body"><label>Dashboard Grouping</label><span>Group items by status, category, or release date.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" data-pref="dashboardSort" id="setting-dashboardSort">
      <div class="settings-row-icon"><i data-lucide="arrow-down-wide-narrow"></i></div>
      <div class="settings-row-body"><label>Dashboard Sorting</label><span>Choose the default item order.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" data-pref="dashboardShowThumbnails" data-direct-toggle="true" role="switch" aria-checked="false" id="setting-dashboardShowThumbnails">
      <div class="settings-row-icon"><i data-lucide="image"></i></div>
      <div class="settings-row-body"><label>Show Thumbnails</label><span>Show or hide item artwork on the Dashboard.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" data-pref="dashboardShowRatings" data-direct-toggle="true" role="switch" aria-checked="false" id="setting-dashboardShowRatings">
      <div class="settings-row-icon"><i data-lucide="star"></i></div>
      <div class="settings-row-body"><label>Show Ratings</label><span>Show or hide ratings in Dashboard cards.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" data-pref="dashboardShowProgress" data-direct-toggle="true" role="switch" aria-checked="false" id="setting-dashboardShowProgress">
      <div class="settings-row-icon"><i data-lucide="percent"></i></div>
      <div class="settings-row-body"><label>Show Progress</label><span>Show or hide progress values and rings.</span></div>
      <div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button></div></div><div class="settings-page-header settings-detail-group-title"><h4 class="settings-section-title">Layout and actions</h4></div><div class="settings-section"><div class="settings-list"><button type="button" class="settings-row settings-row-picker" id="reset-dashboard-preferences">
      <div class="settings-row-icon"><i data-lucide="rotate-ccw"></i></div>
      <div class="settings-row-body"><label>Reset Dashboard Preferences</label><span>Restore the default Dashboard layout and display settings.</span></div>
      <div class="settings-row-value"><span>Reset</span><i data-lucide="rotate-ccw" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" data-pref="oneHandedMode" id="setting-oneHandedMode">
      <div class="settings-row-icon"><i data-lucide="hand"></i></div>
      <div class="settings-row-body"><label>One-handed Layout</label></div>
      <div class="settings-row-value"><span>Off</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" id="rating-format-picker" data-pref="ratingFormat">
      <div class="settings-row-icon"><i data-lucide="star"></i></div>
      <div class="settings-row-body"><label>Rating Format</label></div>
      <div class="settings-row-value"><span id="rating-format-picker-value">5 stars</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" id="dashboard-row-actions-picker" data-pref="dashboardRowActions">
      <div class="settings-row-icon"><i data-lucide="mouse-pointer-click"></i></div>
      <div class="settings-row-body"><label>Row Actions</label></div>
      <div class="settings-row-value"><span id="dashboard-row-actions-picker-value">3-dot menu</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" data-pref="tabletTwoColumn" data-direct-toggle="true" role="switch" aria-checked="false" id="setting-tabletTwoColumn">
      <div class="settings-row-icon"><i data-lucide="columns-2"></i></div>
      <div class="settings-row-body"><label>Tablet Layout</label></div>
      <div class="settings-row-value"><span>Two columns</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button></div></div></section></main>

<div id="picker-modal" class="modal-overlay">
  <div class="modal-content picker-sheet">
    <div class="modal-header">
      <h3 id="picker-modal-title" class="modal-title">Options</h3>
      <button class="modal-close" id="picker-modal-close">&times;</button>
    </div>
    <div id="picker-options-list" class="picker-options-list"></div>
  </div>
</div>
</div><script defer src="core/applock.js"></script><script defer src="features/metadata.js"></script><script defer src="core/cache-manager.js"></script><script defer src="core/app-navigation.js"></script><script defer src="core/app-backups.js"></script><script defer src="core/app-search.js"></script><script defer src="app.js"></script><script defer src="core/fonts.js"></script><script defer src="static/pages/settings/settings-index.js"></script></body></html>
