<!DOCTYPE html>
<html lang="en">
<head>
<base href="../../../"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CueMark - Settings</title><link rel="manifest" href="manifest.json"><script src="core/theme-bootstrap.js"></script><link rel="stylesheet" href="static/index.css"><script defer src="core/logcat.js"></script><script defer src="lucide.min.js"></script></head>
<body class="settings-screen settings-category-screen"><div id="app-container">
<header class="settings-ios-header">
  <button class="settings-ios-back page-back-btn" type="button" data-back-fallback="static/pages/settings/settings.html">‹ Settings</button>
  <h1>Notifications</h1>
  <span class="settings-ios-header-spacer" aria-hidden="true"></span>
</header>
<main><section id="tab-settings" class="tab-content active settings-category-page"><div class="settings-page-header settings-category-title"><p class="settings-breadcrumb"><a href="static/pages/settings/settings.html">Settings</a> / Notifications</p><h2>Notifications</h2></div>
<div class="settings-search settings-page-search"><i data-lucide="search"></i><input data-settings-search-input type="search" placeholder="Search all settings" aria-label="Search all settings"><button type="button" class="settings-search-clear" data-settings-search-clear aria-label="Clear search" hidden><i data-lucide="x"></i></button></div>
<div class="settings-search-history" data-settings-search-history hidden></div>
<div class="settings-search-results" data-settings-search-results hidden aria-live="polite"></div>

<div class="settings-page-header settings-detail-group-title"><h4 class="settings-section-title">Notification check</h4></div><div class="settings-section"><div class="settings-list"><button type="button" class="settings-row settings-row-picker" id="notification-test">
      <div class="settings-row-icon"><i data-lucide="bell-ring"></i></div><div class="settings-row-body"><label>Test Notification</label></div><div class="settings-row-value"><span>Test</span><i data-lucide="send" class="settings-row-chevron"></i></div>
    </button></div></div><div class="settings-section"><div class="settings-list"><button type="button" class="settings-row settings-row-picker" data-pref="notificationSound" data-direct-toggle="true" role="switch" aria-checked="false" id="setting-notificationSound"><div class="settings-row-icon"><i data-lucide="volume-2"></i></div><div class="settings-row-body"><label>Notification Sound</label></div><div class="settings-row-value"><span>On</span></div></button>
<button type="button" class="settings-row settings-row-picker" data-pref="notificationVibration" data-direct-toggle="true" role="switch" aria-checked="false" id="setting-notificationVibration"><div class="settings-row-icon"><i data-lucide="smartphone"></i></div><div class="settings-row-body"><label>Vibration</label></div><div class="settings-row-value"><span>On</span></div></button>
<button type="button" class="settings-row settings-row-picker" data-pref="reminderDays" id="setting-reminderDays"><div class="settings-row-icon"><i data-lucide="calendar-clock"></i></div><div class="settings-row-body"><label>Reminder Days</label></div><div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div></button>
<button type="button" class="settings-row settings-row-picker" id="notification-permission" data-inline-toggle="true" role="switch" aria-checked="false">
      <div class="settings-row-icon"><i data-lucide="bell"></i></div><div class="settings-row-body"><label>Notifications</label><span>Turn CueMark reminders on or off.</span></div><div class="settings-row-value"><span id="notification-permission-status">Off</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button>
<button type="button" class="settings-row settings-row-picker" id="notification-quiet-hours" data-inline-toggle="true" role="switch" aria-checked="false">
      <div class="settings-row-icon"><i data-lucide="moon-star"></i></div><div class="settings-row-body"><label>Quiet Hours</label></div><div class="settings-row-value"><span id="notification-quiet-hours-status">Off</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button></div></div><div class="settings-page-header settings-detail-group-title"><h4 class="settings-section-title">Reminder types</h4></div><div class="settings-section"><div class="settings-list"><button type="button" class="settings-row settings-row-picker" data-pref="notificationPerCategory" data-direct-toggle="true" role="switch" aria-checked="false" id="setting-notificationPerCategory"><div class="settings-row-icon"><i data-lucide="tags"></i></div><div class="settings-row-body"><label>Per-Category Reminders</label></div><div class="settings-row-value"><span>Off</span></div></button><button type="button" class="settings-row settings-row-picker" data-pref="notificationGrouping" id="setting-notificationGrouping"><div class="settings-row-icon"><i data-lucide="layers-2"></i></div><div class="settings-row-body"><label>Notification Grouping</label></div><div class="settings-row-value"><span></span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div></button><button type="button" class="settings-row settings-row-picker" id="notification-backup-reminders" data-inline-toggle="true" role="switch" aria-checked="false">
      <div class="settings-row-icon"><i data-lucide="database-backup"></i></div><div class="settings-row-body"><label>Backup Reminders</label></div><div class="settings-row-value"><span id="notification-backup-reminders-status">Off</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" id="notification-cloud-failures" data-inline-toggle="true" role="switch" aria-checked="false">
      <div class="settings-row-icon"><i data-lucide="cloud-alert"></i></div><div class="settings-row-body"><label>Cloud Sync Failures</label></div><div class="settings-row-value"><span id="notification-cloud-failures-status">On</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" id="notification-episode-reminders" data-inline-toggle="true" role="switch" aria-checked="false">
      <div class="settings-row-icon"><i data-lucide="tv-2"></i></div><div class="settings-row-body"><label>Episode Reminders</label></div><div class="settings-row-value"><span id="notification-episode-reminders-status">On</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" id="notification-unfinished-items" data-inline-toggle="true" role="switch" aria-checked="false">
      <div class="settings-row-icon"><i data-lucide="list-todo"></i></div><div class="settings-row-body"><label>Unfinished Items</label></div><div class="settings-row-value"><span id="notification-unfinished-items-status">Off</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button></div></div><div class="settings-page-header settings-detail-group-title"><h4 class="settings-section-title">Schedule and quiet hours</h4></div><div class="settings-section"><div class="settings-list"><button type="button" class="settings-row settings-row-picker" id="notification-reminder-time">
      <div class="settings-row-icon"><i data-lucide="alarm-clock"></i></div><div class="settings-row-body"><label>Custom Reminder Time</label></div><div class="settings-row-value"><span id="notification-reminder-time-status">09:00</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button><button type="button" class="settings-row settings-row-picker" id="notification-snooze">
      <div class="settings-row-icon"><i data-lucide="alarm-clock-plus"></i></div><div class="settings-row-body"><label>Remind Me Later</label></div><div class="settings-row-value"><span id="notification-snooze-status">1 hour</span><i data-lucide="chevron-right" class="settings-row-chevron"></i></div>
    </button></div></div></section></main>
<nav class="bottom-nav"><a class="nav-item" data-tab="tab-dashboard" href="static/pages/main/dashboard.html" aria-label="Dashboard"><i data-lucide="layout-grid"></i></a><a class="nav-item" data-tab="tab-timeline" href="static/pages/main/timeline.html" aria-label="Timeline"><i data-lucide="calendar"></i></a><a class="nav-item" data-tab="tab-discover" href="static/pages/main/discover.html" aria-label="Discover"><i data-lucide="search"></i></a><a class="nav-item" data-tab="tab-sources" href="static/pages/main/sources.html" aria-label="Sources"><i data-lucide="database"></i></a><a class="nav-item" data-tab="tab-explore" href="static/pages/main/explore.html" aria-label="Explore"><i data-lucide="compass"></i></a><a class="nav-item" data-tab="tab-stats" href="static/pages/main/statistics.html" aria-label="Statistics"><i data-lucide="pie-chart"></i></a><a class="nav-item active" data-tab="tab-settings" href="static/pages/settings/settings.html" aria-label="Settings"><i data-lucide="settings"></i></a></nav>

  <div class="modal-content picker-sheet">
    <div class="modal-header">
      <h3 id="picker-modal-title" class="modal-title">Options</h3>
      <button class="modal-close" id="picker-modal-close">&times;</button>
    </div>
    <div id="picker-options-list" class="picker-options-list"></div>
  </div>
</div>
</div><script defer src="core/applock.js"></script><script defer src="features/metadata.js"></script><script defer src="core/cache-manager.js"></script><script defer src="core/app-navigation.js"></script><script defer src="core/app-backups.js"></script><script defer src="core/app-search.js"></script><script defer src="app.js"></script><script defer src="core/fonts.js"></script><script defer src="static/pages/settings/settings-index.js"></script></body></html>
