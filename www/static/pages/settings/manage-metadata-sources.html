<!DOCTYPE html>
<html lang="en">
<head>
<base href="../../../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquashDB - Metadata Sources</title>
  <link rel="manifest" href="manifest.json">
  <script src="core/theme-bootstrap.js"></script><link rel="stylesheet" href="static/index.css">
  <script defer src="core/logcat.js"></script><script defer src="lucide.min.js"></script>
</head>
<body class="manage-screen metadata-sources-screen">
  <div id="app-container">
    <header class="settings-ios-header">
      <button class="settings-ios-back page-back-btn" type="button" data-back-fallback="static/pages/settings/settings.html">‹ Back</button>
      <h1>Metadata Sources</h1>
      <span class="settings-ios-header-spacer" aria-hidden="true"></span>
    </header>
    <main>
      <section class="tab-content active">
        <h4 class="settings-section-title">Built-in sources</h4>
        <p class="metadata-sources-hint">Choose which catalogs to search. Drag to change their order.</p>
        <div class="metadata-source-filters" role="group" aria-label="Filter metadata sources">
          <button type="button" class="metadata-source-filter active" data-source-filter="all" aria-pressed="true">All</button>
          <button type="button" class="metadata-source-filter" data-source-filter="enabled" aria-pressed="false">Enabled</button>
          <button type="button" class="metadata-source-filter" data-source-filter="disabled" aria-pressed="false">Disabled</button>
        </div>
        <div class="settings-section">
          <div id="builtin-metadata-sources-list" class="settings-section-inner"></div>
        </div>
        <h4 class="settings-section-title">Custom sources</h4>
        <div class="settings-section">
          <div id="custom-metadata-sources-list" class="settings-section-inner"></div>
          <button type="button" id="create-metadata-source-btn" class="btn btn-secondary" style="width:100%;margin-top:8px;">
            <i data-lucide="plus"></i> Add custom source
          </button>
        </div>
      </section>
    </main>
  </div>
  <script defer src="core/applock.js"></script><script defer src="features/metadata.js"></script><script defer src="core/cache-manager.js"></script><script defer src="core/app-navigation.js"></script><script defer src="core/app-backups.js"></script><script defer src="core/app-search.js"></script><script defer src="app.js"></script><script defer src="core/fonts.js"></script>
</body>
</html>
