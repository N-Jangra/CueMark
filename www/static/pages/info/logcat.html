<!DOCTYPE html>
<html lang="en">
<head>
<base href="../../../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueMark - Logcat</title>
  <link rel="manifest" href="manifest.json">
  <script src="core/theme-bootstrap.js"></script><link rel="stylesheet" href="static/index.css">
  <script defer src="core/logcat.js"></script>
  <script defer src="lucide.min.js"></script>
</head>
<body class="info-screen">
  <div id="app-container">
    <header class="settings-ios-header">
      <button class="settings-ios-back page-back-btn" type="button" data-back-fallback="static/pages/settings/settings.html">‹ Back</button>
      <h1>Logcat</h1>
      <button type="button" class="settings-ios-back logcat-clear-action" id="logcat-clear-btn" aria-label="Clear logs" title="Clear logs"><i data-lucide="trash-2"></i></button>
    </header>
    <main>
      <section class="tab-content active info-logcat-page">
        <p class="info-intro">Recent app events to help diagnose issues.</p>

        <div class="chips-container" id="logcat-filter-chips" role="group" aria-label="Filter logs">
          <button type="button" class="chip active" data-level="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-level="info" aria-pressed="false">Info</button>
          <button type="button" class="chip" data-level="warn" aria-pressed="false">Warnings</button>
          <button type="button" class="chip" data-level="error" aria-pressed="false">Errors</button>
        </div>

        <div id="logcat-list" class="logcat-list"></div>
        <div id="logcat-empty" class="empty-state">
          <i data-lucide="terminal"></i>
          <h3>No Logs Yet</h3>
          <p>Nothing has been logged for this filter since the log buffer started.</p>
        </div>

        <div class="page-back-actions">
          <a class="btn btn-secondary" href="static/pages/info/logcat-history.html"><i data-lucide="archive"></i> View older logs</a>
        </div>

      </section>
    </main>
  </div>
  <script defer src="core/applock.js"></script><script defer src="features/metadata.js"></script><script defer src="core/app-navigation.js"></script><script defer src="core/app-backups.js"></script><script defer src="core/app-search.js"></script><script defer src="app.js"></script><script defer src="core/fonts.js"></script>
  <script>
    let logcatFilter = "all";

    function formatLogcatTime(ms) {
      const d = new Date(ms);
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function renderLogcat() {
      const list = document.getElementById("logcat-list");
      const emptyEl = document.getElementById("logcat-empty");
      if (!list || !emptyEl) return;

      const entries = (window.cuemarkLogcat ? window.cuemarkLogcat.getEntries() : [])
        .filter(e => logcatFilter === "all" || e.level === logcatFilter)
        .slice()
        .reverse();

      if (entries.length === 0) {
        list.innerHTML = "";
        emptyEl.style.display = "flex";
        return;
      }
      emptyEl.style.display = "none";

      list.innerHTML = entries.map(e => `
        <div class="logcat-row logcat-row-${e.level}">
          <span class="logcat-row-level">${e.level}</span>
          <span class="logcat-row-time">${formatLogcatTime(e.time)} · ${e.page}</span>
          <pre class="logcat-row-message"></pre>
          <button type="button" class="logcat-expand" hidden>Show more</button>
        </div>
      `).join("");

      // Set message text via textContent (not innerHTML) so logged values with
      // HTML-like content (URLs, JSON, stack traces) can't inject markup.
      const previewLength = 280;
      list.querySelectorAll(".logcat-row").forEach((row, i) => {
        const el = row.querySelector(".logcat-row-message");
        const expand = row.querySelector(".logcat-expand");
        const message = String(entries[i].message ?? "");
        if (!el || !expand || message.length <= previewLength) {
          if (el) el.textContent = message;
          return;
        }
        el.textContent = `${message.slice(0, previewLength)}…`;
        expand.hidden = false;
        expand.addEventListener("click", () => {
          const expanded = el.classList.toggle("expanded");
          el.textContent = expanded ? message : `${message.slice(0, previewLength)}…`;
          expand.textContent = expanded ? "Show less" : "Show more";
        });
      });

      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("#logcat-filter-chips .chip").forEach(chip => {
        chip.addEventListener("click", () => {
          logcatFilter = chip.dataset.level;
          document.querySelectorAll("#logcat-filter-chips .chip").forEach(c => {
            const active = c === chip;
            c.classList.toggle("active", active);
            c.setAttribute("aria-pressed", String(active));
          });
          renderLogcat();
        });
      });

      const clearBtn = document.getElementById("logcat-clear-btn");
      if (clearBtn) {
        // No confirm() dialog here — some WebViews render it unreliably or
        // suppress it outright, which made the button look broken. Logs are
        // low-stakes debug data, so clearing immediately is fine; the entries
        // are gone from localStorage the moment this runs (see clear() in
        // logcat.js), not just hidden from the current render.
        clearBtn.addEventListener("click", () => {
          if (window.cuemarkLogcat) window.cuemarkLogcat.clear();
          logcatFilter = "all";
          document.querySelectorAll("#logcat-filter-chips .chip").forEach(c => {
            const active = c.dataset.level === "all";
            c.classList.toggle("active", active);
            c.setAttribute("aria-pressed", String(active));
          });
          renderLogcat();
        });
      }

      renderLogcat();
    });
  </script>
</body>
</html>
